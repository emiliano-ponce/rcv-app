services:
  rcv-app:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: rcv-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: "8080"
    networks:
      - edge
    # No ports published to the host. The shared Caddy proxy (emiliano-ponce/homelab) reaches this container
    # over the shared "edge" network by its service name (rcv-app:8080).

networks:
  edge:
    external: true
