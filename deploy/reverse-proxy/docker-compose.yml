services:
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    networks:
      - edge
    # No ports published — cloudflared reaches Caddy over the "edge" network.
    # Caddy fans requests back out to each app container by hostname.

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel run
    environment:
      TUNNEL_TOKEN: "${TUNNEL_TOKEN}"
    networks:
      - edge
    depends_on:
      - caddy

networks:
  edge:
    external: true

volumes:
  caddy_data:
